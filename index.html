<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<title>何瑞璋 · DOMINIC HO</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100dvh}
body[data-theme=gold]{--acc:#c8a962;--accbg:rgba(200,169,98,.13)}
body[data-theme=red]{--acc:#a3222c;--accbg:rgba(163,34,44,.16)}
body[data-theme=gray]{--acc:#7d8790;--accbg:rgba(125,135,144,.14)}
body{--bg:#0a0a0c;--pnl:#101014;--ln:#26252c;--tx:#e9e6e1;--dm:#8a8780;
  background:var(--bg);color:var(--tx);font:14px/1.75 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--ln);padding:8px 10px;cursor:pointer;transition:.15s}
button:active{background:var(--accbg)}
.hidden{display:none!important}
.dim{color:var(--dm)}.tiny{font-size:11px;line-height:1.5}
.serif{font-family:"Songti SC","Noto Serif SC",serif}

/* 顶栏 */
header{flex:0 0 auto;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--ln)}
.brand{font-size:14px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sep{color:#3a3941;margin:0 7px}
header nav{display:none}

main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#center{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#side,#right{display:none}

#log{flex:1 1 auto;overflow:auto;padding:14px 14px 6px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.evt{text-align:center;font-size:11.5px;color:#4d4b55;letter-spacing:1px;margin:12px 0 18px}
.msg{margin-bottom:16px}
.msg .who{font-size:11.5px;color:var(--dm);margin-bottom:4px}
.msg.user{text-align:right}
.msg.user .txt{display:inline-block;text-align:left;border-right:2px solid var(--acc);padding-right:11px}
.msg.ai .txt{border-left:2px solid #2b2a32;padding-left:12px}
.msg .txt{white-space:pre-wrap;word-break:break-word}

/* 态度条（移动端常驻） */
#attRow{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:7px 12px;border-top:1px solid var(--ln);scrollbar-width:none}
#attRow::-webkit-scrollbar{display:none}
#attRow button{flex:0 0 auto;border-radius:16px;padding:5px 13px;font-size:12.5px;background:var(--pnl)}
#attRow button.on{border-color:var(--acc);color:var(--acc);background:var(--accbg)}

#composer{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 12px;border-top:1px solid var(--ln);background:var(--bg)}
#inp{flex:1;resize:none;height:44px;max-height:132px;font-size:16px;line-height:1.6;background:var(--pnl);border:1px solid var(--ln);color:var(--tx);padding:10px 11px;outline:none;border-radius:2px}
#inp:focus{border-color:var(--acc)}
button.main{background:var(--accbg);border-color:var(--acc);color:var(--acc);padding:11px 18px;border-radius:2px;white-space:nowrap}

/* 底部导航 */
#bnav{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ln);background:#0c0c0f;padding-bottom:env(safe-area-inset-bottom)}
#bnav button{border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;color:var(--dm);border-radius:0}
#bnav button i{font-style:normal;font-size:15px;line-height:1.1}
#bnav button.on{color:var(--acc)}

/* 弹层 / 底部抽屉 */
#mask{position:fixed;inset:0;background:rgba(4,4,6,.8);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:50}
#modal{background:var(--bg);border:1px solid var(--ln);border-radius:14px 14px 0 0;width:100%;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(20px + env(safe-area-inset-bottom));position:relative}
#modal h2{font-family:"Songti SC",serif;font-size:18px;letter-spacing:2px;margin:0 26px 3px 0;font-weight:400}
#modal .sub{font-size:12px;color:var(--dm);margin-bottom:14px}
#modal .x{position:absolute;top:6px;right:6px;border:none;font-size:16px;color:var(--dm);width:40px;height:40px}
#modal .grab{width:36px;height:3px;background:#2e2d35;border-radius:3px;margin:-4px auto 10px}

.grid{display:grid;gap:10px;grid-template-columns:1fr}
.card{border:1px solid var(--ln);padding:12px;background:var(--pnl)}
.card .t{font-size:14px}
.card .s{font-size:11.5px;color:var(--dm)}
.card .p{font-family:"Songti SC",serif;font-size:18px;color:var(--acc);margin:5px 0}
.card .d{font-size:12px;color:var(--dm);line-height:1.6}
input,textarea,select{font:inherit;font-size:16px;background:var(--pnl);border:1px solid var(--ln);color:var(--tx);padding:10px 11px;outline:none;width:100%;border-radius:2px}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:72px}
label.f{display:block;font-size:12px;color:var(--dm);margin:10px 0 4px}
.rowf{display:flex;gap:10px;flex-wrap:wrap}
.rowf>*{flex:1;min-width:130px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--ln);padding:0 6px;color:var(--dm);margin-left:4px}
.dice{display:flex;gap:12px;justify-content:center;margin:18px 0}
.dice div{width:64px;height:64px;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--pnl);border-radius:8px;color:var(--acc)}
.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bets button{padding:14px 4px;font-size:14px;background:var(--pnl)}
.bets button small{display:block;color:var(--dm);font-size:11px}
.chips{display:flex;gap:7px;margin:10px 0;flex-wrap:wrap}
.chips button{border-radius:18px;padding:5px 13px;font-size:12.5px;background:var(--pnl)}
.chips button.on{border-color:var(--acc);color:var(--acc)}
.list{border:1px solid var(--ln);padding:10px 11px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pnl)}
.list .l{min-width:0}
.list .n{font-size:13.5px}
.list .s{font-size:11.5px;color:var(--dm);word-break:break-word}
.bar{margin-bottom:12px}
.bar .row{display:flex;justify-content:space-between;font-size:13px}
.bar .row b{font-weight:500;color:var(--acc)}
.track{height:3px;background:#1e1d23;margin:5px 0 3px}
.track i{display:block;height:3px;background:linear-gradient(90deg,var(--acc),transparent)}
.lab{font-size:12px;color:var(--dm);letter-spacing:1px;margin:14px 0 7px}
button.block{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:13.5px;padding:11px 12px;background:var(--pnl);border-radius:2px}
.phone{background:#0d0d10;border:1px solid var(--ln);padding:14px;border-radius:6px}
.phead{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dm);margin-bottom:12px}
.wbig{font-family:"Songti SC",serif;font-size:28px;letter-spacing:1px;margin:2px 0}
.sect{border-top:1px solid var(--ln);margin-top:12px;padding-top:10px}
.sect .h{display:flex;justify-content:space-between;font-size:12px;color:var(--dm);margin-bottom:7px}
.sect .h em{font-style:normal;font-size:10px;letter-spacing:1px;color:#3d3c45}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0}
.kv span:first-child{color:var(--dm)}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1a1a20;border:1px solid var(--acc);color:var(--tx);padding:8px 16px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1}

/* ===== 桌面端 ===== */
@media(min-width:901px){
  header{height:52px;padding:0 16px}
  .brand{font-size:15px}
  header nav{display:flex;gap:6px}
  header nav button{font-size:12px;padding:4px 9px;border-color:transparent;color:var(--dm)}
  header nav button:hover{color:var(--acc);border-color:var(--ln)}
  #bnav{display:none}
  main{display:grid;grid-template-columns:236px 1fr 330px}
  #side,#right{display:block;overflow:auto;padding:16px 14px;border-right:1px solid var(--ln)}
  #right{border-right:none;border-left:1px solid var(--ln)}
  #attRow{display:none}
  #log{padding:24px 40px 8px}
  .msg{max-width:760px}
  .msg.user{margin-left:auto}
  #composer{padding:12px 18px}
  #inp{height:56px;font-size:14px}
  #mask{align-items:center;padding:24px}
  #modal{border-radius:0;max-width:880px;max-height:86vh;padding:22px 24px 26px}
  #modal .x{top:10px;right:10px}
  #modal .grab{display:none}
  .grid{gap:10px}
  .grid.g2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  #toast{bottom:36px}
}
</style>
</head>
<body data-theme="gold">
<header>
  <div class="brand serif"><b>何瑞璋</b><span class="sep">·</span><span id="posTag" class="dim"></span><span class="sep">·</span><span id="clock" class="dim"></span></div>
  <nav>
    <button onclick="app.m('map')">地图</button>
    <button onclick="app.m('phone')">手机</button>
    <button onclick="app.m('assets')">资产</button>
    <button onclick="app.m('saves')">存档</button>
    <button onclick="app.m('wb')">世界书</button>
    <button onclick="app.m('mem')">记忆</button>
    <button onclick="app.m('cfg')">设定</button>
    <button onclick="app.m('api')">API</button>
    <button id="rainBtn" onclick="app.rain()">雨声</button>
    <button onclick="app.theme()">色调</button>
  </nav>
</header>

<main>
  <aside id="side"></aside>
  <section id="center">
    <div id="log"></div>
    <div id="attRow"></div>
    <div id="composer">
      <textarea id="inp" rows="1" placeholder="说点什么……"></textarea>
      <button class="main" onclick="app.send()">发送</button>
    </div>
  </section>
  <aside id="right"></aside>
</main>

<div id="bnav">
  <button onclick="app.m('bars')"><i>▮</i>五值</button>
  <button onclick="app.m('map')"><i>◈</i>地图</button>
  <button onclick="app.m('phone')"><i>▤</i>手机</button>
  <button onclick="app.m('shop')"><i>◇</i>AURUM</button>
  <button onclick="app.m('more')"><i>⋯</i>更多</button>
</div>

<div id="mask" class="hidden"><div id="modal"></div></div>
<div id="toast"></div>

<script>
/* ================= 基础 ================= */
const $=s=>document.querySelector(s), K='hrz_dom_ho_v2';
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900)};
const cmoney=n=>{n=Number(n)||0;const a=Math.abs(n);if(a>=1e8)return (n/1e8).toFixed(2).replace(/\.?0+$/,'')+' 亿';if(a>=1e4)return (n/1e4).toFixed(1).replace(/\.0$/,'')+' 万';return String(n)};
const nf=n=>Number(n||0).toLocaleString('en-US');
const tok=t=>Math.ceil((t||'').length*0.7);

const DEF_PROMPT='你是这段故事的记录员。把「新增剧情」并进「已有摘要」，写成不超过 400 字的中文摘要。\n保留：关系变化、他说过的重要的话、去过的地方、答应过的事、没解决的矛盾。\n\n【已有摘要】\n{{old}}\n\n【新增剧情】\n{{new}}';
const ATTS=[['温柔地回','温柔'],['冷淡地回','冷淡'],['试探地','试探'],['生气地回','生气'],['撒娇','撒娇'],['不出声','不出声']];
const STAGES={
  '初见':      {money:5000,   stock:'无',          aff:5,  love:0,  trust:2,  ctrl:20, danger:3,  pos:'澳门 · 主力娱乐场'},
  '恋爱一年':  {money:200000, stock:'澳博 300 股', aff:45, love:38, trust:30, ctrl:45, danger:10, pos:'小宝 · 半山别墅 · 客厅'},
  '何瑞璋订婚':{money:800000, stock:'长实 500 股', aff:60, love:52, trust:44, ctrl:66, danger:26, pos:'何家老宅 · 大厅'},
  '此刻':      {money:56000,  stock:'无',          aff:18, love:0,  trust:12, ctrl:35, danger:8,  pos:'小宝 · 半山别墅 · 客厅'}
};
const PLACES=['小宝 · 半山别墅','澳门 · 主力娱乐场','中环 AURUM 私选','何家老宅','半岛酒店 · 大堂吧','跑马地 · 马场','尖沙咀 · 夜总会','南丫岛 · 码头','湾仔 · 会所','波尔多 · 酒庄','何氏大厦 78 楼'];
const SHOP=[
 {c:'衣饰',n:'墨绿丝绒长裙',p:88000,d:'中环一个不挂牌的裁缝做的。',req:12},
 {c:'衣饰',n:'象牙白真丝衬衫',p:26000,d:'很安静的一件。',req:8},
 {c:'首饰',n:'素圈钻戒（不镶）',p:420000,d:'碎钻藏在戒臂内侧。',req:40},
 {c:'首饰',n:'百达翡丽 · 复杂功能',p:3800000,d:'他抽屉里有六块。',req:55},
 {c:'车',n:'阿斯顿 · 马丁 DB12',p:4600000,d:'他车库里那台 GT3 终于不是唯一有声音的车。',req:50},
 {c:'玩物',n:'栗色纯血马',p:12800000,d:'养在他的马场，Shadow 隔壁。',req:58},
 {c:'宅邸',n:'南丫岛庄园',p:860000000,d:'过户那天他没说什么，只签了字。',req:70},
 {c:'礼物',n:'万宝龙 1930 复刻钢笔',p:46000,d:'他签过很多份文件，笔尖是他的字迹。',req:10},
 {c:'礼物',n:'黑玛瑙袖扣',p:78000,d:'和那枚家族戒指同一个颜色。',req:14}
];

function defState(){return{
  theme:'gold', stage:'此刻', clock:'22:47',
  user:{name:'你',age:26,money:56000,stock:'无',persona:'26 岁，从内地来港半年，在何家的场子里做事。你不算客人，也不是主人。',home:'小宝 · 半山别墅'},
  him:{aff:18,love:0,trust:12,ctrl:35,danger:8,mood:'看不出情绪，像平时一样'},
  pos:{you:'小宝 · 半山别墅 · 客厅',him:'澳门 · 主力娱乐场'},
  attitude:'', chat:[],
  mem:{summary:'',every:10,read:8,prompt:DEF_PROMPT},
  wb:{on:true,items:[],limit:0,saveflow:false},
  ps:{on:true,items:[],limit:0,saveflow:false},
  saves:[null,null,null,null], auto:null, owned:[], spent:0, gifted:0, net:241175000000, myNet:0,
  api:{list:[{name:'OpenAI 兼容',prov:'openai',url:'https://api.openai.com/v1',key:'',model:'gpt-4o-mini',max:900,temp:0.9}],cur:0},
  shopCustom:[], lastBet:5000,
  phone:{msg:[{n:'赵敏言',t:'未婚妻',time:'21:09',c:'外面嘅事我唔理。但唔好搞到上封面。'},
              {n:'何瑞珩',t:'二弟',time:'20:41',c:'做好你份事。'},
              {n:'何瑞廷',t:'三弟',time:'02:14',c:'唔好搞佢。'},
              {n:'何瑞仪',t:'大姐',time:'18:20',c:'父亲嗰边，你同佢讲两句。佢老咗。'},
              {n:'Alan',t:'助理',time:'18:40',c:'报告放我台上。'},
              {n:'她',t:'你',time:'17:22',c:'夜啲我自己揸车。'}],
         calls:[{n:'赵敏言',time:'20:12',c:'未接 · 12 秒'},{n:'Alan',time:'18:02',c:'已接 · 4 分 06 秒'}],
         notes:[{n:'围骰通吃，唔好再落 5k。',time:'10 月 24'},{n:'她怕黑，走廊灯留一盏。',time:'10 月 19'}]}
}}
let S, WBT='ps', SHOPCAT='全部';
try{S=Object.assign(defState(),JSON.parse(localStorage.getItem(K)||localStorage.getItem('hrz_dom_ho_v1')||'{}'))}catch(e){S=defState()}
const save=()=>localStorage.setItem(K,JSON.stringify(S));

/* ================= 渲染 ================= */
function renderSide(){
  const h=S.him, v=[['好感度',h.aff,'她给你留给心与时间'],['爱意',h.love,'真正动意，勾起心尖'],['信任',h.trust,'他愿意让你看见多少'],['掌控欲',h.ctrl,'他想握住你多少'],['危险',h.danger,'局势两头还有多远']];
  $('#side').innerHTML=
   `<div class="rel" style="font-size:12px;color:var(--dm);letter-spacing:2px;margin-bottom:14px">关系 · ${esc(S.stage)}</div>`+
   v.map(([n,val,d])=>`<div class="bar"><div class="row"><span>${n}</span><b>${val||0}</b></div><div class="track"><i style="width:${Math.min(100,val||0)}%"></i></div><div class="dim tiny">${d}</div></div>`).join('')+
   `<button class="block" onclick="app.m('cfg')">她的人设：查看 / 修改</button>
    <div class="lab">怎么回他</div>`+
   ATTS.map(([n,d])=>`<button class="block" onclick="app.att('${n}')">${n} <span class="dim tiny">${d}</span></button>`).join('')+
   `<div class="mood" style="font-size:12.5px;margin:12px 0;padding-top:12px;border-top:1px solid var(--ln)">他此刻：<span class="dim">${esc(h.mood)}</span></div>
    <div class="lab">操作</div>
    <button class="block" onclick="app.retry()">↻ 重roll</button>
    <button class="block" onclick="app.edit('user')">改我的话</button>
    <button class="block" onclick="app.edit('assistant')">改他的话</button>
    <button class="block" onclick="app.search()">搜索聊天内容</button>`;
}
function renderRight(){
  const h=S.him;
  $('#right').innerHTML=`
  <div class="phone">
    <div class="phead"><span>${esc(S.clock)}</span><span>何家 5G ▮▮▮</span></div>
    <div class="dim tiny">钱包</div>
    <div class="wbig">${nf(Math.round(S.user.money))}</div>
    <div class="dim tiny">现金 HK$ ${cmoney(S.user.money)} · 名下 ${S.owned.length} 件 · 允许度 ${h.aff}</div>
    <div style="margin-top:12px;display:flex;gap:6px">
      <button style="flex:1" onclick="app.m('assets')">资产</button>
      <button style="flex:1" onclick="app.m('shop')">AURUM</button>
    </div>
    <div class="sect"><div class="h">名下 <em>UNDER MY NAME</em></div>
      ${S.owned.length?S.owned.map(n=>`<div class="kv"><span>${esc(n)}</span><span class="dim">已有</span></div>`).join(''):'<div class="dim tiny">名下什么都没有。</div>'}
      <div class="kv"><span>${esc(S.user.home)}</span><span class="dim">租住</span></div>
    </div>
    <div class="sect"><div class="h">他给的 <em>FROM HIM</em></div>
      <div class="kv"><span>他为妳花过</span><span>HK$ ${cmoney(S.gifted)}</span></div>
      <div class="kv"><span>掌控欲</span><span>${h.ctrl}</span></div>
      <div class="dim tiny" style="margin-top:6px">仅记录 · 数字都是虚构的</div>
    </div>
  </div>`;
}
function renderAtt(){
  $('#attRow').innerHTML=ATTS.map(([full,short])=>`<button class="${S.attitude===full?'on':''}" onclick="app.att('${full}')">${short}</button>`).join('');
}
function renderChat(){
  const box=$('#log');
  box.innerHTML=S.chat.length?'':`<div class="evt">第 ${esc(S.stage)} · ${esc(S.pos.you)} · ${esc(S.clock)}</div>`;
  S.chat.forEach(m=>{
    const d=document.createElement('div');
    d.className='msg '+(m.role==='user'?'user':'ai');
    d.innerHTML=`<div class="who">${m.role==='user'?esc(S.user.name):'何瑞璋'} · ${esc(S.clock)}</div><div class="txt">${esc(m.text)}</div>`;
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}
function render(){
  renderSide();renderRight();renderAtt();renderChat();
  $('#posTag').textContent=S.pos.you+' · 何瑞璋在'+S.pos.him;
  $('#clock').textContent=S.clock;
  document.body.dataset.theme=S.theme;
}

/* ================= 提示词 ================= */
function activeItems(g){
  const arr=(g.items||[]).filter(i=>i.on).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  let out=arr.map(i=>`【${i.name||'条目'}】\n${i.content||''}`).join('\n\n');
  if(g.saveflow&&g.limit>0&&out.length>g.limit) out=out.slice(0,g.limit)+'\n（以下省略）';
  return out;
}
function sysPrompt(){
  const h=S.him, L=[];
  L.push('你正在扮演「何瑞璋 DOMINIC HO」：港澳顶级豪门何家长子，致远集团董事会主席，家族话事人。寸头、金丝眼镜、定制黑西装，左手无名指一枚素圈。说话极简、不解释、不重复；发火时音量反而更低。粤语对白给原文，并在括号里给普通话翻译。不要替用户写台词，不要写旁白总结，一次只输出他这一段。');
  L.push(`【用户人设】${S.user.name}，${S.user.age} 岁。${S.user.persona}`);
  L.push(`【当前节点】${S.stage}`);
  L.push(`【五值】好感 ${h.aff}／爱意 ${h.love}／信任 ${h.trust}／掌控欲 ${h.ctrl}／危险 ${h.danger}。数值低则冷淡保留，高才允许松口。`);
  L.push(`【他此刻的情绪】${h.mood}`);
  L.push(`【位置】她在 ${S.pos.you}；你在 ${S.pos.him}。`);
  if(S.mem.summary) L.push(`【剧情摘要（你的记忆）】\n${S.mem.summary}`);
  if(S.ps.on){const p=activeItems(S.ps); if(p) L.push(`【预设】\n${p}`);}
  if(S.wb.on&&S.wb.items.length){
    const recent=S.chat.slice(-4).map(m=>m.text).join('\n');
    const hit=S.wb.items.filter(i=>i.on&&(!i.keys||!i.keys.length||i.keys.some(k=>k&&recent.includes(k))));
    if(hit.length) L.push('【世界书】\n'+activeItems({items:hit,limit:S.wb.limit,saveflow:S.wb.saveflow}));
  }
  if(S.attitude) L.push(`【本轮态度】${S.attitude}。请按这个态度回应。`);
  L.push('【格式】对白用「」，动作与环境写成独立短段，不用 markdown 标题，不加解释。');
  return L.join('\n\n');
}
function buildMsgs(){
  const n=Math.max(1,Number(S.mem.read)||8)*2;
  const msgs=[{role:'system',content:sysPrompt()}];
  S.chat.filter(m=>m.text).slice(-n).forEach(m=>msgs.push({role:m.role==='user'?'user':'assistant',content:m.text}));
  if(!S.chat.length) msgs.push({role:'user',content:'（场景开始。请以何瑞璋的身份先开口一句。）'});
  return msgs;
}

/* ================= API ================= */
async function sse(res,onDelta,ex){
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    const ps=buf.split('\n\n');buf=ps.pop();
    for(const p of ps){const ln=p.split('\n').find(l=>l.trim().startsWith('data:'));if(!ln)continue;
      let d=ln.trim().slice(5).trim();if(!d||d==='[DONE]')continue;
      let j;try{j=JSON.parse(d)}catch(e){continue}
      const t=ex(j);if(t)onDelta(t);}}
}
async function callAI(msgs,onDelta){
  const c=S.api.list[S.api.cur]||{}; if(!c.model) throw new Error('先在「API」里填模型名');
  const base=(c.url||'').replace(/\/+$/,'');
  let res;
  if(c.prov==='openai'||c.prov==='ollama'){
    const url=/chat\/completions$/.test(base)?base:base+'/chat/completions';
    res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...(c.key?{Authorization:'Bearer '+c.key}:{})},
      body:JSON.stringify({model:c.model,messages:msgs,temperature:Number(c.temp)||0.9,max_tokens:Number(c.max)||900,stream:true})});
    if(!res.ok) throw new Error('API '+res.status+'：'+(await res.text()).slice(0,160));
    await sse(res,onDelta,j=>j.choices?.[0]?.delta?.content||'');
  }else if(c.prov==='anthropic'){
    const sys=msgs.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
    const rest=msgs.filter(m=>m.role!=='system');
    res=await fetch(base+'/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:c.model,max_tokens:Number(c.max)||900,temperature:Number(c.temp)||0.9,system:sys,messages:rest,stream:true})});
    if(!res.ok) throw new Error('API '+res.status+'：'+(await res.text()).slice(0,160));
    await sse(res,onDelta,j=>j.type==='content_block_delta'?(j.delta?.text||''):'');
  }else{
    const url=base+'/v1beta/models/'+encodeURIComponent(c.model)+':streamGenerateContent?alt=sse&key='+encodeURIComponent(c.key);
    const sys=msgs.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
    const contents=msgs.filter(m=>m.role!=='system').map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
    res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents,systemInstruction:{parts:[{text:sys}]},generationConfig:{temperature:Number(c.temp)||0.9,maxOutputTokens:Number(c.max)||900}})});
    if(!res.ok) throw new Error('API '+res.status+'：'+(await res.text()).slice(0,160));
    await sse(res,onDelta,j=>(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join(''));
  }
}

const app={
  theme(){S.theme=S.theme==='gold'?'red':S.theme==='red'?'gray':'gold';save();render();app.close();toast('色调：'+(S.theme==='gold'?'黑金':S.theme==='red'?'深红':'冷灰'))},
  att(a){S.attitude=(S.attitude===a?'':a);save();render()},
  async send(){
    const inp=$('#inp'), t=inp.value.trim(); if(!t) return;
    inp.value=''; inp.style.height='44px';
    S.chat.push({role:'user',text:t});
    S.chat.push({role:'assistant',text:''});
    const idx=S.chat.length-1, att=S.attitude;
    S.attitude=''; save(); render();
    const box=$('#log'), el=box.lastChild.querySelector('.txt');
    el.textContent='…';
    let acc='';
    try{
      await callAI(buildMsgs(),d=>{acc+=d;el.textContent=acc;box.scrollTop=box.scrollHeight});
      if(!acc) acc='（他没有回话。）';
    }catch(e){acc='⚠️ '+e.message;}
    S.chat[idx].text=acc; save(); render();
    if(Number(S.mem.every)>0 && S.chat.filter(m=>m.role==='user').length%Number(S.mem.every)===0) app.summarize(true);
  },
  async retry(){
    if(!S.chat.length) return toast('还没有对话');
    let i=S.chat.length-1;
    if(S.chat[i].role==='assistant') S.chat.splice(i,1);
    const last=[...S.chat].reverse().find(m=>m.role==='user');
    if(!last) return toast('没有可重roll的内容');
    const text=last.text; S.chat.pop();
    $('#inp').value=text; save(); render(); app.send();
  },
  edit(r){
    const idx=[...S.chat].map((m,i)=>m.role===r?i:-1).filter(i=>i>=0).pop();
    if(idx===undefined) return toast('没有可修改的内容');
    app.close();
    const v=prompt('修改这句：',S.chat[idx].text); if(v==null) return;
    S.chat[idx].text=v; save(); render();
  },
  search(){
    const q=prompt('搜索聊天内容：'); if(!q) return;
    const hits=S.chat.map((m,i)=>({i,...m})).filter(m=>m.text.includes(q));
    app.open('搜索：'+q, hits.length?hits.map(m=>`<div class="list"><div class="l"><div class="n">${m.role==='user'?esc(S.user.name):'何瑞璋'}</div><div class="s">${esc(m.text.slice(0,140))}</div></div><span class="tag">#${m.i+1}</span></div>`).join(''):'<div class="dim">没有找到。</div>');
  },
  rain(){
    const b=$('#rainBtn');
    if(window._rain){try{window._rain.close()}catch(e){};window._rain=null;toast('雨声已关');return}
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const len=ctx.sampleRate*3, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;
    const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=200;
    const g=ctx.createGain();g.gain.value=0.16;
    src.connect(lp);lp.connect(hp);hp.connect(g);g.connect(ctx.destination);src.start();
    window._rain=ctx;toast('雨声已开');
  },
  open(t,html){$('#modal').innerHTML=`<div class="grab"></div><button class="x" onclick="app.close()">✕</button><h2>${t}</h2>${html}`;$('#mask').classList.remove('hidden')},
  close(){$('#mask').classList.add('hidden')},
  m(k){(op[k]||(()=>{}))()}
};

  const r=[0,0,0].map(()=>SY[Math.floor(Math.random()*SY.length)]);

app.prefresh=async function(tab){

    let out=''; await callAI([{role:'system',content:'你只输出 JSON，不要解释。'},{role:'user',content:ask}],d=>out+=d);
    const j=JSON.parse(out.replace(/```json|```/g,'').trim());
    if(tab==='notes')S.phone.notes=j.items; else if(tab==='calls')S.phone.calls=j.items; else S.phone.msg=j.items;

op.saves=function(){

    <button style="flex:1;padding:13px" onclick="app.import()">导入存档</button></div>`);

app.ssave=function(i){
  const snap=JSON.parse(JSON.stringify(S)); snap.api.list.forEach(p=>p.key='');
  const o={tag:S.pos.you+' · 何瑞璋在'+S.pos.him,n:S.chat.length,time:new Date().toLocaleString('zh-CN'),s:snap};
  if(i<0)S.auto=o; else S.saves[i]=o;

};
app.sload=function(i){
  const o=i<0?S.auto:S.saves[i]; if(!o) return toast('空档位');
  const api=S.api; S=Object.assign(defState(),o.s); S.api=api; save(); render(); app.close(); toast('已读取');
};
app.export=function(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='he_ruizhang_'+Date.now()+'.json';a.click();
};
app.import=function(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=()=>{const f=inp.files[0];const r=new FileReader();
    r.onload=()=>{try{S=Object.assign(defState(),JSON.parse(r.result));save();render();app.close();toast('已导入')}catch(e){toast('文件读不了')}};
    r.readAsText(f)};
  inp.click();
};

op.wb=function(tab){ WBT=tab||WBT||'ps'; const g=WBT==='wb'?S.wb:S.ps;

  app.open(WBT==='wb'?'世界书':'预设',`
  <div style="display:flex;gap:10px;margin-bottom:12px">
    <button onclick="app.wbtab('wb')" style="${WBT==='wb'?'border-color:var(--acc);color:var(--acc)':''}">世界书</button>
    <button onclick="app.wbtab('ps')" style="${WBT==='ps'?'border-color:var(--acc);color:var(--acc)':''}">预设</button></div>
  <label class="f" style="display:flex;align-items:center;gap:8px"><input type="checkbox" style="width:20px;height:20px" ${g.on?'checked':''} onchange="app.wbset('on',this.checked)"> 大开关（关闭后整组不注入）</label>
  <label class="f" style="display:flex;align-items:center;gap:8px"><input type="checkbox" style="width:20px;height:20px" ${g.saveflow?'checked':''} onchange="app.wbset('saveflow',this.checked)"> 省流模式（每回合少注入一些字）</label>
  <div class="rowf"><div><label class="f">上限（字）· 0 = 不限</label><input type="number" value="${g.limit||0}" onchange="app.wbset('limit',Number(this.value)||0)"></div>
   <div><label class="f">当前注入估算</label><input value="${chars} 字 ≈ ${tok((g.items||[]).filter(i=>i.on).map(i=>i.content).join(''))} token" readonly></div></div>
  <div class="lab">条目（顺序即注入顺序）</div>
  ${(g.items||[]).length?(g.items||[]).map((it,i)=>`<div class="list" style="align-items:flex-start">
    <div class="l"><div class="n">${esc(it.name||'条目 '+(i+1))}${it.keys&&it.keys.length?'<span class="tag">'+esc(it.keys.join(' / '))+'</span>':''}</div>
    <div class="s">${(it.content||'').length} 字 · ${it.on?'已启用':'已停用'}</div></div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:150px">
      <button onclick="app.wbmv(${i},-1)">↑</button><button onclick="app.wbmv(${i},1)">↓</button>
      <button onclick="app.wbtoggle(${i})">${it.on?'停用':'启用'}</button>
      <button onclick="app.wbedit(${i})">改</button>
      <button onclick="app.wbdel(${i})">删</button></div></div>`).join(''):'<div class="dim tiny">还没有条目。可手动添加，或导入酒馆 JSON。</div>'}
  <div style="display:flex;gap:8px;margin-top:12px">
    <button style="flex:1;padding:12px" onclick="app.wbadd()">+ 添加条目</button>
    <button style="flex:1;padding:12px" onclick="app.wbimport()">从酒馆 JSON 导入</button></div>
  <div class="dim tiny" style="margin-top:10px">世界书 ${S.wb.items.length} 条 · 预设 ${S.ps.items.length} 段。支持 entries / prompts 两种酒馆结构。</div>`);
};
const curG=()=>WBT==='wb'?S.wb:S.ps;
app.wbtab=k=>{WBT=k;op.wb(k)};
app.wbset=(k,v)=>{curG()[k]=v;save();op.wb()};
app.wbtoggle=i=>{const g=curG();g.items[i].on=!g.items[i].on;save();op.wb()};
app.wbmv=(i,d)=>{const a=curG().items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];a.forEach((x,k)=>x.order=k);save();op.wb()};
app.wbedit=i=>{const it=curG().items[i];const c=prompt('内容',it.content);if(c==null)return;it.content=c;save();op.wb()};
app.wbdel=i=>{curG().items.splice(i,1);save();op.wb()};
app.wbadd=()=>{const n=prompt('条目名');if(!n)return;const c=prompt('内容')||'';const k=prompt('关键词（逗号分隔，可留空）')||'';
  const g=curG(); g.items.push({name:n,content:c,keys:k?k.split(/[,，]/).map(x=>x.trim()).filter(Boolean):[],on:true,order:g.items.length});save();op.wb()};
app.wbimport=()=>{
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.multiple=true;
  inp.onchange=()=>{[...inp.files].forEach(f=>{const r=new FileReader();
    r.onload=()=>{try{
      const j=JSON.parse(r.result);
      if(j.entries){
        Object.values(j.entries).forEach(e=>S.wb.items.push({name:e.comment||(e.key&&e.key[0])||'条目',keys:e.key||[],content:e.content||'',on:!e.disable,order:e.order||S.wb.items.length}));
        toast('世界书导入 '+Object.keys(j.entries).length+' 条');WBT='wb';op.wb('wb');
      }else if(j.prompts){
        j.prompts.forEach((p,i)=>S.ps.items.push({name:p.name||p.identifier||('段 '+(i+1)),keys:[],content:p.content||'',on:p.enabled!==false,order:i}));
        toast('预设导入 '+j.prompts.length+' 段');WBT='ps';op.wb('ps');
      }else toast('不是酒馆格式');
      save();
    }catch(e){toast('解析失败')}};r.readAsText(f)})};
  inp.click();
};

app.summarize=async function(auto){
  const m=S.mem;
  if(!S.chat.filter(x=>x.text).length) return toast('没有对话');
  const n=(Number(m.read)||8)*2;
  const fresh=S.chat.filter(x=>x.text).slice(-n).map(x=>(x.role==='user'?'她：':'他：')+x.text).join('\n');
  const p=m.prompt.replace('{{old}}',m.summary||'（无）').replace('{{new}}',fresh);
  try{ let out=''; await callAI([{role:'user',content:p}],d=>out+=d);
    S.mem.summary=out.trim();save(); if(auto) toast('已自动生成摘要'); else op.mem();
  }catch(e){toast('总结失败：'+e.message)}
};

#boot .slot .n{font-size:13.5px}
#boot .slot .d{font-size:11.5px;color:#8a8780;margin-top:3px}
.pv{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #26252c}
.pv:active{background:rgba(200,169,98,.05)}
.pv .av{width:32px;height:32px;border-radius:50%;background:#1c1b22;display:flex;align-items:center;justify-content:center;font-size:13px;color:#c8a962;flex:0 0 auto}
.pv .nm{flex:1;min-width:0;font-size:14px}
.pv .nm i{display:block;font-style:normal;font-size:11px;color:#8a8780}
.pv .st{font-size:11px;border:1px solid #2c3a2c;color:#7fae7f;padding:1px 8px;border-radius:10px}
.pv .st.off{color:#b06a6a;border-color:#3a2c2c}
</style>
<script>
(function(){
var G=function(id){return document.getElementById(id)};
var NAMES={openai:"OpenAI 兼容",anthropic:"Anthropic",gemini:"Gemini",ollama:"Ollama"};
var ORDER=["openai","anthropic","gemini","ollama"];
S.api.list.forEach(function(p){
 if(!p.prov)p.prov="openai"; if(!p.url)p.url="https://api.openai.com/v1";
 if(p.key===undefined)p.key=""; if(p.keys===undefined)p.keys="";
 if(p.multiKey===undefined)p.multiKey=false; if(!p.group)p.group="其他";
 if(p.enabled===undefined)p.enabled=true; if(p.model===undefined)p.model="";
 if(!p.models)p.models=[]; if(!p.max)p.max=900; if(!p.temp)p.temp=0.9;
});
save();
var raw=window.callAI;
window.callAI=function(m,d){
 var p=S.api.list[S.api.cur]||{};
 if(p.multiKey&&p.keys){
  var a=p.keys.split(String.fromCharCode(10)).join(",").split(",").map(function(t){return t.trim()}).filter(function(t){return t.length>8});
  if(a.length)p.key=a[Math.floor(Math.random()*a.length)];
 }
 return raw(m,d);
};
var b=document.createElement("div");
b.id="boot";
b.innerHTML=`<div class="t">何 瑞 璋</div><div class="s2">D O M I N I C　H O</div>
 <div class="btns">
  <button onclick="app.bNew()">新 开 一 档</button>
  <button onclick="app.bLoad()">读 取 旧 档</button>
  <button onclick="app.bGo()" style="background:none;border-color:#1e1d24;color:#8a8780">继 续 上 次</button>
 </div><div class="sub" id="bSub"></div>`;
document.body.appendChild(b);
app.bClose=function(){var x=G("boot");if(x)x.parentNode.removeChild(x)};
app.bGo=function(){app.bClose()};
app.bNew=function(){
 var s=G("bSub");s.style.display="block";
 s.innerHTML=["初见","恋爱一年","何瑞璋订婚","此刻"].map(function(k){
  return `<button class="slot" onclick="app.bPick('${k}')"><div class="n">${k}</div><div class="d">重置五值、现金、位置，聊天清空</div></button>`;
 }).join("");
};
app.bPick=function(k){app.stage(k);app.bClose();toast("已开始："+k)};
app.bLoad=function(){
 var s=G("bSub");s.style.display="block";var h="";
 h+=slotHtml("自动存档",S.auto,-1);
 S.saves.forEach(function(v,i){h+=slotHtml("档位 "+(i+1),v,i)});
 h+=`<button class="slot" onclick="app.import()"><div class="n">从文件导入</div><div class="d">选一个之前导出的 json 存档</div></button>`;
 s.innerHTML=h;
};
function slotHtml(lab,o,i){
 if(!o)return `<div class="slot" style="opacity:.4"><div class="n">${lab}</div><div class="d">空</div></div>`;
 return `<button class="slot" onclick="app.bRead(${i})"><div class="n">${lab}</div><div class="d">${esc(o.tag)} · ${o.n} 条 · ${esc(o.time)}</div></button>`;
}
app.bRead=function(i){app.sload(i);app.bClose()};
var PS={q:"",cur:null};
op.api=function(i){ if(i!==undefined)PS.cur=i; if(PS.cur===null){pvList()}else{pvDetail()} };
function pvList(){
 var L=S.api.list.map(function(p,i){return{p:p,i:i}}).filter(function(x){
  return !PS.q||x.p.name.indexOf(PS.q)>=0||(x.p.group||"").indexOf(PS.q)>=0;
 });
 app.open("供应商",
  `<div style="display:flex;gap:8px;margin-bottom:8px"><input value="${esc(PS.q)}" placeholder="搜索供应商或分组" oninput="app.pvQ(this.value)" style="flex:1"><button onclick="app.pvAdd()" style="padding:0 18px;font-size:18px">＋</button></div>`
  +L.map(function(x){var p=x.p;return `<div class="pv" onclick="app.pvOpen(${x.i})"><div class="av">${esc((p.name||"?").slice(0,1))}</div><div class="nm">${esc(p.name)}<i>${esc(p.model||"未选模型")}</i></div><div class="st ${p.enabled?"":"off"}">${p.enabled?"启用":"禁用"}</div><div style="color:#55545e">›</div></div>`}).join("")
  +`<div class="dim tiny" style="margin-top:12px">当前使用：${esc((S.api.list[S.api.cur]||{}).name||"无")} · 点一行编辑</div>`);
}
function pvDetail(){
 var p=S.api.list[PS.cur]||{}; var i=PS.cur;
 var opts=ORDER.map(function(k){return `<option value="${k}" ${p.prov===k?"selected":""}>${NAMES[k]}</option>`}).join("");
 app.open("供应商 · "+esc(p.name||""),
  `<div class="rowf"><div><label class="f">名称</label><input value="${esc(p.name)}" onchange="app.pvSet('name',this.value)"></div><div><label class="f">分组</label><input value="${esc(p.group)}" onchange="app.pvSet('group',this.value)"></div></div>
   <label class="f">供应商类型</label><select onchange="app.pvSet('prov',this.value)">${opts}</select>
   <label class="f">是否启用</label><select onchange="app.pvSet('enabled',this.value==='1')"><option value="1" ${p.enabled?"selected":""}>启用</option><option value="0" ${p.enabled?"":"selected"}>禁用</option></select>
   <label class="f">Base URL</label><input value="${esc(p.url)}" onchange="app.pvSet('url',this.value)" placeholder="https://api.deepseek.com/v1">
   <label class="f">API Key</label><input type="password" value="${esc(p.key)}" onchange="app.pvSet('key',this.value)">
   <label class="f">多 Key 模式</label><select onchange="app.pvSet('multiKey',this.value==='1')"><option value="0" ${p.multiKey?"":"selected"}>关</option><option value="1" ${p.multiKey?"selected":""}>开（随机轮换）</option></select>
   ${p.multiKey?`<label class="f">Key 列表（一行一个）</label><textarea onchange="app.pvSet('keys',this.value)">${esc(p.keys)}</textarea>`:""}
   <label class="f">模型</label><input value="${esc(p.model)}" onchange="app.pvSet('model',this.value)" placeholder="deepseek-chat">
   <div style="display:flex;gap:8px;margin-top:10px"><button style="flex:1;padding:11px" onclick="app.pvFetch()">从接口拉取模型</button><button style="flex:1;padding:11px" onclick="app.pvTest()">测试连接</button></div>
   ${p.models&&p.models.length?`<div class="chips" style="margin-top:10px">${p.models.slice(0,80).map(function(m){return `<button class="${m===p.model?"on":""}" onclick="app.pvPick('${m}')">${esc(m)}</button>`}).join("")}</div>`:"<div class='dim tiny' style='margin-top:8px'>还没有模型列表，点上面「从接口拉取模型」</div>"}
   <div class="rowf" style="margin-top:10px"><div><label class="f">max_tokens</label><input type="number" value="${p.max}" onchange="app.pvSet('max',Number(this.value))"></div><div><label class="f">temperature</label><input type="number" step="0.1" value="${p.temp}" onchange="app.pvSet('temp',Number(this.value))"></div></div>
   <div style="display:flex;gap:8px;margin-top:14px"><button style="flex:1;padding:12px" onclick="app.pvUse()">设为当前使用</button><button style="flex:1;padding:12px" onclick="app.pvDel()">删除</button></div>
   <button style="width:100%;padding:12px;margin-top:8px;color:#8a8780" onclick="app.pvBack()">← 返回供应商列表</button>`);
}
app.pvQ=function(v){PS.q=v;pvList()};
app.pvOpen=function(i){PS.cur=i;pvDetail()};
app.pvBack=function(){PS.cur=null;pvList()};
app.pvSet=function(k,v){S.api.list[PS.cur][k]=v;save();if(k==="multiKey")pvDetail()};
app.pvPick=function(m){S.api.list[PS.cur].model=m;save();pvDetail()};
app.pvUse=function(){S.api.cur=PS.cur;save();toast("当前："+S.api.list[PS.cur].name)};
app.pvAdd=function(){
 S.api.list.push({name:"新供应商",prov:"openai",url:"https://api.openai.com/v1",key:"",keys:"",multiKey:false,group:"其他",enabled:true,model:"",models:[],max:900,temp:0.9});
 PS.cur=S.api.list.length-1;save();pvDetail();
};
app.pvDel=function(){
 if(S.api.list.length<2)return toast("至少留一个");
 S.api.list.splice(PS.cur,1);S.api.cur=0;PS.cur=null;save();pvList();
};
app.pvFetch=async function(){
 var p=S.api.list[PS.cur]; var base=(p.url||"").replace(/[/]+$/,"");
 try{
  var url,hd={};
  if(p.prov==="anthropic"){url=base+"/v1/models";hd["x-api-key"]=p.key;hd["anthropic-version"]="2023-06-01";hd["anthropic-dangerous-direct-browser-access"]="true";}
  else if(p.prov==="gemini"){url=base+"/v1beta/models?key="+encodeURIComponent(p.key);}
  else if(p.prov==="ollama"){url=base.replace(/[/]v1$/,"")+"/api/tags";}
  else{url=base+"/models";hd["Authorization"]="Bearer "+p.key;}
  var r=await fetch(url,{headers:hd});
  var j=await r.json();
  var ids=((j.data)||(j.models)||[]).map(function(m){return m.id||m.name||""}).filter(Boolean);
  if(p.prov==="gemini")ids=ids.map(function(x){return x.split("/").pop()});
  if(!ids.length)throw new Error("返回里没有模型");
  p.models=ids; if(!p.model)p.model=ids[0];
  save();pvDetail();toast("拉到 "+ids.length+" 个模型");
 }catch(e){toast("拉取失败："+e.message)}
};
app.pvTest=async function(){
 var o=S.api.cur;S.api.cur=PS.cur;
 try{var t="";await window.callAI([{role:"user",content:"只回两个字：通了"}],function(d){t+=d});
  toast(t?("成功："+t.slice(0,14)):"返回空");}
 catch(e){toast(e.message)}
 S.api.cur=o;save();
};
})();
</script>
</body>
</html>
