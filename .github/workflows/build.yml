name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 生成 Android 工程
        run: |
          mkdir -p app/src/main/java/com/hrz/app app/src/main/assets app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "hrz"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hrz.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.hrz.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName '1.2'
              }
              signingConfigs {
                  rel {
                      storeFile file("hrz.jks")
                      storePassword "hrzpass123"
                      keyAlias "hrz"
                      keyPassword "hrzpass123"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.rel }
                  release { signingConfig signingConfigs.rel; minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="何瑞璋"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0A0C" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#C8A962" android:strokeWidth="1.2"
                    android:fillColor="#00000000" android:pathData="M54,12a42,42 0 1,0 0.01,0z"/>
          </vector>
          EOF

          cat > app/src/main/java/com/hrz/app/MainActivity.java <<'EOF'
          package com.hrz.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.util.Base64;
          import androidx.webkit.WebViewAssetLoader;
          import org.json.JSONObject;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Iterator;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setSupportZoom(false);
                  s.setTextZoom(100);

                  web.addJavascriptInterface(new Bridge(), "NativeFetch");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                  });

                  setContentView(web);
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              private void emit(final String js) {
                  web.post(new Runnable() {
                      @Override public void run() { web.evaluateJavascript(js, null); }
                  });
              }

              class Bridge {
                  @JavascriptInterface
                  public void post(final String id, final String url, final String headersJson, final String body) {
                      new Thread(new Runnable() {
                          @Override public void run() {
                              HttpURLConnection c = null;
                              try {
                                  c = (HttpURLConnection) new URL(url).openConnection();
                                  c.setRequestMethod("POST");
                                  c.setDoOutput(true);
                                  c.setConnectTimeout(20000);
                                  c.setReadTimeout(180000);
                                  c.setRequestProperty("Accept-Encoding", "identity");
                                  JSONObject h = new JSONObject(headersJson);
                                  Iterator<String> it = h.keys();
                                  while (it.hasNext()) {
                                      String k = it.next();
                                      c.setRequestProperty(k, h.getString(k));
                                  }
                                  OutputStream os = c.getOutputStream();
                                  os.write(body.getBytes("UTF-8"));
                                  os.flush();
                                  os.close();
                                  int code = c.getResponseCode();
                                  String ct = c.getContentType();
                                  emit("window.__nativeStart(" + JSONObject.quote(id) + "," + code + "," + JSONObject.quote(ct == null ? "" : ct) + ")");
                                  InputStream in = (code >= 400) ? c.getErrorStream() : c.getInputStream();
                                  if (in == null) in = c.getErrorStream();
                                  if (in != null) {
                                      byte[] buf = new byte[1024];
                                      int n;
                                      while ((n = in.read(buf)) > 0) {
                                          byte[] part = new byte[n];
                                          System.arraycopy(buf, 0, part, 0, n);
                                          emit("window.__nativeChunk(" + JSONObject.quote(id) + "," + JSONObject.quote(Base64.encodeToString(part, Base64.NO_WRAP)) + ")");
                                      }
                                      in.close();
                                  }
                                  emit("window.__nativeEnd(" + JSONObject.quote(id) + ")");
                              } catch (Exception e) {
                                  emit("window.__nativeErr(" + JSONObject.quote(id) + "," + JSONObject.quote(String.valueOf(e.getMessage())) + ")");
                              } finally {
                                  if (c != null) c.disconnect();
                              }
                          }
                      }).start();
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent e) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && web != null && web.canGoBack()) {
                      web.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, e);
              }
          }
          EOF

      - name: 准备固定签名
        run: |
          if [ -f keystore/b64.txt ]; then
            base64 -d keystore/b64.txt > app/hrz.jks
            echo "复用已有签名"
          else
            mkdir -p keystore
            keytool -genkeypair -keystore app/hrz.jks -alias hrz -keyalg RSA -keysize 2048 -validity 10000 -storepass hrzpass123 -keypass hrzpass123 -dname "CN=HRZ,OU=Self,O=Self,L=HK,S=HK,C=HK"
            base64 -w0 app/hrz.jks > keystore/b64.txt
            git config user.email "hrz-bot@users.noreply.github.com"
            git config user.name "hrz-bot"
            git add keystore/b64.txt
            git commit -m "chore: 保存签名密钥"
            git push origin HEAD:main
            echo "已生成并提交签名密钥"
          fi

      - name: 编译 APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hrz-apk
          path: app/build/outputs/apk/debug/app-debug.apk
